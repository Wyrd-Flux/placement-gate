[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "placement-gate"
version = "0.3.0"
description = "Resource-aware model placement: refuse what will not fit, load what should, and verify what actually ran."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Placement Gate contributors" }]
keywords = ["placement", "gpu", "vram", "ollama", "fail-closed", "provenance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Topic :: System :: Hardware",
]

# The only runtime dependency is pydantic, for the validated model types. The
# placement policy, hardware observation, Ollama adapter, ledger and the verified
# load seam are folded into pgate_demo.placement, so a clone is runnable on its
# own with nothing else installed.
dependencies = ["pydantic>=2.0"]

[project.scripts]
pgate = "pgate_demo.cli:main"

[project.urls]
Homepage = "https://github.com/Wyrd-Flux/placement-gate"
Source = "https://github.com/Wyrd-Flux/placement-gate"

[tool.setuptools.packages.find]
include = ["pgate_demo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
