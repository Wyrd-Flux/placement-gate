[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "placement-gate"
version = "0.1.0"
description = "Resource-aware model placement: refuse what will not fit, load what should, and verify what actually ran."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Placement Gate contributors" }]
license = { file = "LICENSE" }
keywords = ["placement", "gpu", "vram", "ollama", "fail-closed", "provenance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: System :: Hardware",
]

# Placement Gate has no runtime dependencies of its own. Every decision is
# delegated to the upstream `ollama_controller` package, which is NOT published
# on PyPI as of 2026-09-30 and carries no license file. See docs/LICENSING.md.
dependencies = []

[project.scripts]
pgate = "pgate_demo.cli:main"

[project.urls]
Homepage = "https://github.com/Wyrd-Flux/placement-gate"
Source = "https://github.com/Wyrd-Flux/placement-gate"

[tool.setuptools.packages.find]
include = ["pgate_demo*"]

[tool.setuptools.package-data]
pgate_demo = ["pgate.providers.json"]

# The sdist carries the evidence, not just the code. A reviewer should be able
# to read the provenance and licensing analysis without cloning anything.
[tool.setuptools]
license-files = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.exclude-package-data]
"*" = ["tests/*"]
