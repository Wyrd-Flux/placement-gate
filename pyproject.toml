[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "placement-gate"
version = "0.2.0"
description = "Resource-aware model placement: refuse what will not fit, load what should, and verify what actually ran."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Placement Gate contributors" }]
keywords = ["placement", "gpu", "vram", "ollama", "fail-closed", "provenance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Topic :: System :: Hardware",
]

# The placement policy, hardware observation, Ollama adapter, ledger and the
# verified load seam come from wyrd-placement-core. GitHub-only distribution in
# this phase, so the requirement is a direct reference rather than a PyPI name.
dependencies = [
  "wyrd-placement-core @ git+https://github.com/Wyrd-Flux/wyrd-placement-core.git",
]

[project.scripts]
pgate = "pgate_demo.cli:main"

[project.urls]
Homepage = "https://github.com/Wyrd-Flux/placement-gate"
Source = "https://github.com/Wyrd-Flux/placement-gate"
PlacementCore = "https://github.com/Wyrd-Flux/wyrd-placement-core"

[tool.setuptools.packages.find]
include = ["pgate_demo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
